# =============================================================================
# params_batch.yaml — Batch Run Parameters
# =============================================================================


# -----------------------------------------------------------------------------
# Pipeline mode
# -----------------------------------------------------------------------------
#
#   sv_analysis_sc_adjustment_arc   (DEFAULT)
#       → batch_microhomology_arc_search() from sv_analysis_sc_adjustment_arc.py
#         Runs batch_microhomology_search() from sv_analysis_with_sc_adjustment.py
#         unchanged, and for EVERY SC-adjustment cluster also builds an
#         interactive SNP-node rearrangement arc diagram (sv_rearrangement_arc.py)
#         via its per_cluster_hook.  MH and arc outputs share the same clusters
#         and the same pair label:
#           mh_<label>.png  ↔  arc_diagrams/<label>_arc.html
#         Requires networkx in the `ont` conda environment:
#           python -c "import networkx"
#
#   sv_analysis_with_sc_adjustment
#       → batch_microhomology_search() from sv_analysis_with_sc_adjustment.py
#         MH only (no arc diagrams).  Single-pass SA-read discovery (cached),
#         contig filtering, in-CIGAR deletion reads, read-centric Union-Find
#         clustering, consensus building and MMEJ microhomology search.
#

mode: "sv_analysis_sc_adjustment_arc"
# mode: "sv_analysis_with_sc_adjustment"


# -----------------------------------------------------------------------------
# Reference genome
# -----------------------------------------------------------------------------
# ref_path: "/fs04/scratch2/vh83/projects/temp_dnascreen_copy/dnascreen/genomes/GRCh38_GIABv3_no_alt_analysis_set_maskedGRC_decoys_MAP2K3_KMT2C_KCNJ18.fasta.gz"
ref_path: "/fs04/scratch2/vh83/projects/temp_dnascreen_copy/dnascreen/genomes/GCA_000001405.15_GRCh38_no_alt_analysis_set.fna"


# -----------------------------------------------------------------------------
# Output directory
# -----------------------------------------------------------------------------
# Leave blank ("") to auto-derive from BAM filename:
#   results/<barcode_platform>/<bam_stem>/<mode>/
save_dir: ""


# ── Discovery settings (Stages A-D) ──────────────────────────────────────────
min_clip_len: 50        # minimum soft-clip length to consider a clip event
min_support: 5          # minimum reads at a clip cluster/pair to report it
min_support_frac: 0.05  # also require support >= this fraction × local depth
cluster_dist: 10        # bp radius for merging nearby clip events
top_n: 20               # keep only the top-N clip pairs by support
min_mapq: 60            # minimum MAPQ for primary and SA alignments
max_dist: 500000        # ignore candidate pairs spanning > this many bp
                        # (set to null for unlimited)


# ── In-CIGAR deletion reads ──────────────────────────────────────────────────
min_del_len: 50         # min CIGAR D (bp) counted as deletion-read support for a
                        # split pair; 0 disables
del_match_tol: 20       # bp slack when matching a CIGAR D to a split pair


# ── Contig filtering ─────────────────────────────────────────────────────────
edge_buffer: null       # min bp a breakpoint must be from either contig end;
                        # null = flank (or 600 if flank is null)
allowed_chroms: null    # list of contigs to keep, e.g. ["chr17", "chrX"];
                        # null = chr1-22, chrX, chrY (drops chrM, decoys, chrUn_*)


# ── Clustering (Stage E) ─────────────────────────────────────────────────────
bridge_tol: 200         # bp tolerance for SA bridging/read fetches


# ── MH analysis (Stage F) ────────────────────────────────────────────────────
flank: null                     # bp from each breakpoint for consensus;
                                # null = auto-estimate from primary alignment lengths
min_mh: 2                       # minimum microhomology length to report
show_pileup: false              # print HTML pileup to notebook / stdout
show_homozygous_variants: false # report background homozygous SNPs in pileup windows


# ── Arc graph settings (sv_analysis_sc_adjustment_arc only) ──────────────────
arc_padding: 500                    # bp padding for extracting split reads around
                                     # the SC-adjustment cluster span
arc_min_perfect_run: 10             # minimum perfect run (bp) before emitting
                                     # a SNP mismatch node
arc_min_non_split_support: 3        # germline filter: non-split-read alt count
arc_min_non_split_frac: 0.1         # germline filter: non-split-read alt fraction
arc_supp_mapq_min: 0                # minimum MAPQ for supplementary records
arc_min_node_support: 2             # prune graph nodes with lower read support
arc_context_flank: 50               # bp flank per side for context-copy scan
arc_context_min_identity: 1.0       # 1.0=exact context copies only; set e.g. 0.95
                                     # to include diverged segmental duplications
arc_context_search_revcomp: true    # include reverse-complement context copies
arc_max_clusters: null              # null = EVERY cluster gets an arc diagram.
                                     # Integer N = arcs for the top-N clusters only
                                     # (all clusters still get MH), for debug runs.
