# =============================================================================
# params.yaml — Run Parameters
# =============================================================================

# -----------------------------------------------------------------------------
# Pipeline mode
# -----------------------------------------------------------------------------
#
#   sv_analysis
#       → batch_microhomology_search() from sv_analysis.py
#         Pileup-based left+right consensus, MMEJ microhomology search,
#         pileup PNG plots.
#
#   sv_analysis_with_sc_adjustment
#       → batch_microhomology_search() from sv_analysis_with_sc_adjustment.py
#         Same as sv_analysis, but breakpoint pairs that share >sa_share_threshold
#         of their SA-supporting reads are merged (Union-Find).
#         The WIDEST span in the merged cluster sets refined_left/refined_right;
#         all narrower pairs are re-anchored to that wider soft-clip span before
#         consensus building and MH search.  Intended for noisy WGS long-read
#         supplementary alignments where soft-clip tails can still share high
#         identity with reference.
#
#   sv_rearrangement_path
#       → batch_rearrangement_path_search() from sv_rearrangement_path.py
#         Clip-first, PDV-aware, minimap2-based k-mer seed-and-extend
#         reference-path decomposition.  Produces per-pair path CSVs and
#         two-panel figures.

# mode: "sv_analysis"
mode: "sv_analysis_with_sc_adjustment"
# mode: "sv_rearrangement_path"

# -----------------------------------------------------------------------------
# Input files
# -----------------------------------------------------------------------------
